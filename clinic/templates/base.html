<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Clinic Management System{% endblock %}</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        nav {
            background-color: #1f4e5f;
            padding: 20px;
        }

        nav h2 {
            color: white;
            display: inline;
            margin-right: 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        h1 {
            color: #1f4e5f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1f4e5f;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: white;
            padding: 30px;
            width: 200px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card a {
            text-decoration: none;
            color: #1f4e5f;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <nav>

        <h2>🏥 Clinic System</h2>

        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'patients' %}">Patients</a>

        <a href="{% url 'appointments' %}">Appointments</a>

        <a href="{% url 'payments' %}">Payments</a>

    </nav>


    <div class="container">

        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
