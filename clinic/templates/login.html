{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clinic Management System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/stylel.css' %}?v=3">
</head>
<body>

<div class="login-container">

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="alert" aria-live="polite">
            {{ message }}
            <button class="alert-dismiss" type="button" aria-label="Dismiss message">&times;</button>
        </div>
    {% endfor %}
{% endif %}

<div class="login-brand" aria-hidden="true">✚</div>
<p class="eyebrow">Welcome back</p>
<h1>ClinicCare</h1>

<h2>Staff Login</h2>

<form class="login-form" method="POST">

    {% csrf_token %}

    <div class="form-group">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                aria-describedby="password-help"
                required
            >
            <button
                class="password-toggle"
                type="button"
                aria-controls="password"
                aria-label="Show password"
                aria-pressed="false"
            >Show</button>
        </div>
        <small id="password-help" class="login-hint">Keep your clinic account secure.</small>
    </div>

    <button class="button button-primary login-submit" type="submit">Sign in</button>

</form>

</div>

<script src="{% static 'js/script.js' %}?v=3"></script>
</body>
</html>
